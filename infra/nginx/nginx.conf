server {
    listen 80;
    server_name localhost;
    
    # 客户端文件大小限制
    client_max_body_size 100M;
    
    # ─── 前端静态文件 ───
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # 缓存静态资源
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1M;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # ─── 动态路由 SPA fallback（Next 静态导出占位页，客户端 useParams 取真实 id） ───
    location /pills/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /pills/_/index.html;
    }
    location /agents/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /agents/_/index.html;
    }
    location /chat/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /chat/_/index.html;
    }

    # ─── SSE 流式对话（关闭缓冲，延长超时，25s 注释心跳保活） ───
    location /api/v1/chat/sse/ {
        proxy_pass http://go-api:8080/api/v1/chat/sse/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 必须关闭代理缓冲，逐段直发
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 生成可能较长，放宽读写超时（应用层 25s 心跳防空闲断开）
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ─── Go API 反向代理 ───
    location /api/v1/ {
        proxy_pass http://go-api:8080/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # ─── Python 语言引擎 API 代理（开发调试用，生产环境建议不暴露） ───
    location /engine/ {
        proxy_pass http://python-engine:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
