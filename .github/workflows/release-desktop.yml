name: Release desktop

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing semantic-version tag to release (vX.Y.Z)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Existing semantic-version tag to release (vX.Y.Z)"
        required: true
        type: string
    secrets:
      MACOS_SIGN_IDENTITY:
        description: "Optional signing identity already installed on each macOS runner"
        required: false

concurrency:
  group: release-desktop-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        name: Resolve semantic version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$tag' is not a semantic-version tag (vX.Y.Z)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  frontend:
    name: Build embedded frontend
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        working-directory: frontend
        run: pnpm test

      - name: Build static export
        working-directory: frontend
        run: pnpm build

      - name: Stage embedded assets
        run: |
          rm -rf backend/go/internal/webui/out
          cp -R frontend/out backend/go/internal/webui/out

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-webui
          path: backend/go/internal/webui/out
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package ${{ matrix.platform }}
    needs: [prepare, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin-arm64
            wails_platform: darwin/arm64
            arch: arm64
          - os: macos-15-intel
            platform: darwin-amd64
            wails_platform: darwin/amd64
            arch: x64
          - os: windows-2022
            platform: windows-amd64
            wails_platform: windows/amd64
            arch: amd64
    runs-on: ${{ matrix.os }}
    env:
      # macOS 12+ 契约:构建链(go/cgo/Python)统一按 12.0 编译(设计 §5 macOS)
      # 注意:job env 可用上下文不含 runner,用 matrix.os 判断
      MACOSX_DEPLOYMENT_TARGET: ${{ startsWith(matrix.os, 'macos') && '12.0' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go/go.mod
          cache-dependency-path: backend/go/go.sum

      - uses: actions/download-artifact@v4
        with:
          name: desktop-webui
          path: backend/go/internal/webui/out

      - name: Restore target Python runtime
        id: runtime-cache
        uses: actions/cache@v4
        with:
          path: backend/go/dist-runtime
          key: desktop-runtime-v3-${{ matrix.platform }}-${{ hashFiles('scripts/build-python-runtime.sh', 'scripts/lib/runtime-common.sh', 'backend/python/requirements-runtime.txt', 'backend/python/app/**/*.py') }}

      - name: Build target Python runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        # 绝对路径:切子目录后相对路径会失效(计划 Task 1 的路径教训)
        run: ./scripts/build-python-runtime.sh ${{ matrix.platform }} $GITHUB_WORKSPACE/backend/go/dist-runtime

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis --no-progress -y
          }
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Wails application
        working-directory: backend/go
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        # Bash 数组组装参数,避免三平台一行式差异;Windows 追加 -webview2 embed
        # (内嵌 bootstrapper,缺 WebView2 时走内嵌安装流程,设计 §5 Windows)
        run: |
          wails_args=(build -clean -platform "${{ matrix.wails_platform }}")
          wails_args+=(-ldflags "-X github.com/alchemy-furnace/server/internal/buildinfo.Version=${RELEASE_TAG} -X github.com/alchemy-furnace/server/internal/buildinfo.Commit=${RELEASE_SHA} -X github.com/alchemy-furnace/server/internal/buildinfo.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X github.com/alchemy-furnace/server/internal/buildinfo.UpdateRepo=${RELEASE_REPOSITORY}")
          wails_args+=(-skipbindings)
          if [[ "${{ matrix.platform }}" == windows-amd64 ]]; then
            wails_args+=(-webview2 embed)
          fi
          wails build "${wails_args[@]}"

      - name: Assemble release package
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY || '-' }}
        # ci-assemble.sh 内部调用平台 verifier(verify-macos-package.sh /
        # verify-windows-package.ps1),失败即退出;不再在 YAML 内联复制检查
        run: ./scripts/ci-assemble.sh ${{ matrix.platform }} "${{ needs.prepare.outputs.tag }}"

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            backend/go/build/dist/AlchemyFurnace-mac-${{ matrix.arch }}.dmg
            backend/go/build/dist/AlchemyFurnace-mac-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: backend/go/build/dist/AlchemyFurnace-Setup.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [prepare, package]
    # needs 默认语义:任一 matrix package job 失败/skipped 时本 job 自动 skipped,
    # 绝不公开只有部分平台的资产(设计 §6)
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist

      - name: Verify release assets (binaries only)
        run: bash scripts/verify-release-assets.sh dist "${{ needs.prepare.outputs.version }}" --binaries-only

      - name: Generate checksums and release manifest
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          cd dist
          sha256sum AlchemyFurnace-* > checksums.txt
          python3 - "$VERSION" "$TAG" "$REPOSITORY" "$RUN_ID" "$RUN_NUMBER" "$SHA" <<'PY'
          import datetime
          import hashlib
          import json
          import sys

          version, tag, repository, run_id, run_number, sha = sys.argv[1:7]
          asset_names = [
              "AlchemyFurnace-mac-arm64.dmg",
              "AlchemyFurnace-mac-arm64.zip",
              "AlchemyFurnace-mac-x64.dmg",
              "AlchemyFurnace-mac-x64.zip",
              "AlchemyFurnace-Setup.exe",
          ]
          assets = {}
          for name in asset_names:
              data = open(name, "rb").read()
              assets[name] = {"size": len(data), "sha256": hashlib.sha256(data).hexdigest()}
          manifest = {
              "version": version,
              "tag": tag,
              "created_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "build": {
                  "repository": repository,
                  "run_id": run_id,
                  "run_number": run_number,
                  "sha": sha,
              },
              "assets": assets,
          }
          with open("release-manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
          PY

      - name: Re-verify release assets (full contract)
        run: bash scripts/verify-release-assets.sh dist "${{ needs.prepare.outputs.version }}"

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          draft: true
          files: |
            dist/AlchemyFurnace-mac-arm64.dmg
            dist/AlchemyFurnace-mac-arm64.zip
            dist/AlchemyFurnace-mac-x64.dmg
            dist/AlchemyFurnace-mac-x64.zip
            dist/AlchemyFurnace-Setup.exe
            dist/checksums.txt
            dist/release-manifest.json
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(needs.prepare.outputs.tag, '-') }}
          body: |
            ## 桌面端安装

            - macOS Apple Silicon：下载 `AlchemyFurnace-mac-arm64.dmg`
            - macOS Intel：下载 `AlchemyFurnace-mac-x64.dmg`
            - Windows x64：下载 `AlchemyFurnace-Setup.exe`

            当前默认构建未经过 Apple 公证或商业代码签名。macOS 首次启动请右键应用并选择“打开”；Windows SmartScreen 提示时请选择“更多信息”后继续运行。

      - name: Verify draft assets remotely
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          rm -rf remote-verify && mkdir -p remote-verify
          gh release download "$TAG" --dir remote-verify
          bash scripts/verify-release-assets.sh remote-verify "$VERSION"

      - name: Publish release
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        # 远端复验通过才公开;任一步失败时 draft 保留排查,不公开、不标 Latest
        run: gh release edit "$TAG" --draft=false --latest
