# Python 语言引擎 —— demo 模式返回 mock 结果
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-engine
  namespace: alchemy-furnace
  labels:
    app: python-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-engine
  template:
    metadata:
      labels:
        app: python-engine
    spec:
      imagePullSecrets:
        - name: ghcr-auth
      containers:
        - name: python-engine
          image: ghcr.io/<owner>/alchemy-furnace/python-engine:v0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: app-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: python-engine
  namespace: alchemy-furnace
spec:
  type: ClusterIP
  selector:
    app: python-engine
  ports:
    - name: http
      port: 80
      targetPort: 8000
