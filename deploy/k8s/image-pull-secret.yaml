# GHCR 拉取认证 secret 模板
#
# 不要直接 apply —— 用 kubectl create secret docker-registry 动态创建
# (避免把 PAT 提交到 git):
#
#   export GHCR_USER=<github-user>
#   export GHCR_PAT=<ghcr-personal-access-token with read:packages>
#   kubectl create namespace alchemy-furnace
#   kubectl create secret docker-registry ghcr-auth \
#     -n alchemy-furnace \
#     --docker-server=ghcr.io \
#     --docker-username=$GHCR_USER \
#     --docker-password=$GHCR_PAT
#
# 此文件仅作占位,记录期望的 secret 结构
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-auth
  namespace: alchemy-furnace
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"<base64-user:pat>"}}}'
