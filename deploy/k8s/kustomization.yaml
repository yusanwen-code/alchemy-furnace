# 一键 apply：kubectl apply -k deploy/k8s/
#
# 注意：image-pull-secret.yaml 不在此列出 —— 它是模板，
# 真实 secret 用 kubectl create secret docker-registry 动态生成
# （避免把 PAT 提交到 git）
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: alchemy-furnace
resources:
  - namespace.yaml
  - configmap.yaml
  - go-api.yaml
  - python-engine.yaml
  - frontend.yaml
  - ingress.yaml

# 镜像 tag 替换：用 kustomize edit set image 或 CI 渲染
# images:
#   - name: ghcr.io/<owner>/alchemy-furnace/go-api
#     newTag: v0.2.0
