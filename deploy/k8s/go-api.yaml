# Go API 网关 —— demo 模式单副本
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-api
  namespace: alchemy-furnace
  labels:
    app: go-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-api
  template:
    metadata:
      labels:
        app: go-api
    spec:
      imagePullSecrets:
        - name: ghcr-auth
      containers:
        - name: go-api
          image: ghcr.io/<owner>/alchemy-furnace/go-api:v0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: app-config
          readinessProbe:
            httpGet:
              path: /api/v1/system/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/system/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: go-api
  namespace: alchemy-furnace
spec:
  type: ClusterIP
  selector:
    app: go-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
